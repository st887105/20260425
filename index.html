<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>車城國小｜網路健康健檢</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#173641;background:#edf5f5}
*{box-sizing:border-box}
body{margin:0;font-size:16px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
header{background:#123c49;color:#fff}
.wrap{width:min(calc(100% - 32px),960px);margin:auto}
header .wrap{padding:16px 0;font-weight:700;font-size:17px}
main{flex:1;padding:clamp(32px,8vw,72px) 0 40px}
h1{margin:0;font-size:clamp(30px,6vw,50px);letter-spacing:-.04em;line-height:1.15}
.lead{margin:12px 0 0;color:#4d6870}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:30px}
.entry{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #cfdfdf;border-radius:18px;padding:clamp(20px,4vw,30px);text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s;min-height:200px}
.entry:hover{box-shadow:0 0 0 3px #5a9896;transform:translateY(-2px)}
.entry:focus-visible{outline:3px solid #9d5300;outline-offset:3px}
.icon{font-size:36px;line-height:1}
.entry h2{margin:0;font-size:21px}
.entry p{margin:0;color:#4d6870;font-size:15px}
.go{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border-radius:10px;background:#096369;color:#fff;font-weight:650}
.sub{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sub a{font-size:14px;color:#0b5d75}
footer{text-align:center;color:#4d6870;font-size:13px;padding:16px 0 32px}
</style>
</head>
<body>
<header><div class="wrap">車城國小｜網路健康健檢</div></header>
<main class="wrap">
  <h1>網路健康健檢</h1>
  <p class="lead">請選擇要使用的功能。LINE 傳圖、傳檔卡住時，請選「LINE 網路小幫手」；想檢查整體網路狀況，請選「網路健康監控」。</p>
  <div class="grid">
    <a class="entry" href="web/">
      <span class="icon" aria-hidden="true">💬</span>
      <h2>車城國小｜LINE 網路小幫手</h2>
      <p>一鍵切換學網備援 DNS，解決 LINE 傳圖、傳檔卡住的問題，並自動記錄網路狀況給資訊老師。</p>
      <span class="go">進入 →</span>
    </a>
    <a class="entry" href="line-diagnostics/">
      <span class="icon" aria-hidden="true">📡</span>
      <h2>車城國小｜網路健康監控</h2>
      <p>檢查瀏覽器連線、執行 Windows 完整診斷（ipconfig /all），並監測網路 30 分鐘。</p>
      <span class="go">進入 →</span>
    </a>
  </div>
</main>
<footer>車城國小資訊老師徐吉德整理製作@2026</footer>
</body>
</html>
